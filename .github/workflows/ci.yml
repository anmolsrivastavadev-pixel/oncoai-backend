name: CI

on:
  push:
    branches: [main, oncoai-platform]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oncoai
          POSTGRES_PASSWORD: oncoai
          POSTGRES_DB: oncoai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oncoai" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://oncoai:oncoai@localhost:5432/oncoai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build web assets and sync into the Android project
        run: npm run build:android
      - name: Assemble debug APK
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: oncoai-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack (CV-only image to keep the build small)
        env:
          INSTALL_ML: "0"
          FETCH_MODEL: "0"
        run: docker compose up -d --build
      - name: Wait for the API and smoke-test it
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8000/health && break
            sleep 3
          done
          curl -fsS http://localhost:8000/health | grep '"db":"ok"'
          docker compose exec -T backend id -un | grep -x oncoai
          curl -fsS -X POST http://localhost:8000/api/v1/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"smoke@example.com","password":"Smoke-test1","full_name":"Smoke Test"}' | grep access_token
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -100
